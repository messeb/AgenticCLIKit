name: Bug Report
description: Something behaves incorrectly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste prompts, tokens, or private paths.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the run with ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: cli
    attributes:
      label: Which CLI is involved?
      options:
        - Claude Code (claude)
        - Codex (codex)
        - GitHub (gh)
        - Antigravity (agy)
        - None / the core library
        - Not sure
    validations:
      required: true

  - type: textarea
    id: health
    attributes:
      label: Health report
      description: |
        Output of `AgenticCLIKit().healthReport().formattedSummary()`, or
        `swift run agentickit health`. It contains CLI versions and auth state,
        no prompts and no tokens.
      render: text
    validations:
      required: true

  - type: textarea
    id: raw-output
    attributes:
      label: Raw CLI output (for parsing failures)
      description: "`AgentResponse.rawOutput`, redacted as needed."
      render: json

  - type: input
    id: package-version
    attributes:
      label: AgenticCLIKit version
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: macOS and Swift version
      placeholder: "macOS 15.2, Swift 6.0.3"
    validations:
      required: true
