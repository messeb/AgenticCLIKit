name: CLI compatibility

# The dominant risk for this package is CLI churn: all four ship breaking
# changes frequently. This job installs the latest of each, runs the probe-level
# integration tests, and files an issue when the surface drifts — so drift is
# found here rather than in a user's app.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  compatibility:
    name: Probe latest CLI releases
    runs-on: macos-15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Install CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
          brew install gh
          # `agy` has no unattended installer; the Antigravity adapter is
          # skipped here and covered by the local integration suite.

      - name: Record installed versions
        id: versions
        run: |
          {
            echo 'report<<EOF'
            for cli in claude codex gh; do
              printf '%s: ' "$cli"
              "$cli" --version 2>&1 | head -1 || echo "not installed"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Discovery and version parsing only. Auth probes correctly report
      # "requires login" on CI, which is not a failure.
      - name: Compatibility tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          AGENTICCLIKIT_INTEGRATION=1 swift test \
            --filter 'DiscoveryIntegrationTests/discoversVersions' 2>&1 | tee results.log

      - name: File an issue on drift
        if: steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const versions = `${{ steps.versions.outputs.report }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CLI compatibility drift detected (${new Date().toISOString().slice(0, 10)})`,
              labels: ['compatibility'],
              body: [
                'The weekly compatibility run failed against the latest CLI releases.',
                '',
                '## Installed versions',
                '```',
                versions,
                '```',
                '',
                `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'Re-record the fixtures in `Tests/AgenticCLIKitTests/Fixtures/` and update the',
                'adapter flag mapping and `minimumSupportedVersion` as needed.',
              ].join('\n'),
            });
